name: 'Setup Linode CLI'
description: 'Install the Linode CLI in a GitHub Actions environment.'
author: 'Akamai <developers@linode.com>'
branding:
  icon: 'server'
  color: 'orange'
inputs:
  token:
    description: 'The Linode API Personal Access Token to authenticate with. Must not contain carriage returns or newlines.'
  version:
    description: 'The Linode CLI version to install.'
    default: latest
  optional-deps:
    description: 'Whether optional Linode CLI dependencies should be installed.'
    default: false
  setup-python:
    description: 'If true, Python will automatically be installed on the runner.'
    default: true
  upgrade:
    description: 'If true, Linode CLI and its dependencies will be automatically upgraded. (--upgrade)'
    default: true
runs:
  using: 'composite'
  steps:
    - name: Mask the input token
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "${TOKEN}" ]; then
          exit 0
        fi
        # Match actions/toolkit escapeData(): %, \r, \n
        MASK_VALUE="${TOKEN//%/%25}"
        MASK_VALUE="${MASK_VALUE//$'\r'/%0D}"
        MASK_VALUE="${MASK_VALUE//$'\n'/%0A}"
        echo "::add-mask::${MASK_VALUE}"

    - name: Setup Python 3
      uses: actions/setup-python@v7
      if: ${{ inputs.setup-python == 'true' }}
      with:
        python-version: '3.x'

    - name: Determine CLI install arguments
      id: determine_install_args
      shell: bash
      run: |
        # Compute extension
        EXTENSION=""

        if [ "$OPTIONAL_DEPS" == "true" ]
        then
          EXTENSION="[obj]"
        fi
        
        if [ "$VERSION" != "latest" ]
        then
          EXTENSION="${EXTENSION}==${VERSION}"
        fi
        
        echo "version_extension=${EXTENSION}" >> $GITHUB_ENV
        
        # Compute args
        ARGS=""
        
        if [ "$UPGRADE" == "true" ]
        then
          ARGS="${ARGS}--upgrade "
        fi
        
        echo "pip_args=${ARGS}" >> $GITHUB_ENV
      env:
        VERSION: ${{ inputs.version }}
        OPTIONAL_DEPS: ${{ inputs.optional-deps }}
        UPGRADE: ${{ inputs.upgrade }}

    - name: Install the Linode CLI
      run: pip3 install ${pip_args}"linode-cli${version_extension}"
      shell: bash

    - name: Expose the Linode Token to the runner environment
      if: ${{ inputs.token != '' }}
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        if [[ "${TOKEN}" == *$'\n'* || "${TOKEN}" == *$'\r'* ]]; then
          echo "::error::token must not contain carriage returns or newlines"
          exit 1
        fi
        echo "LINODE_CLI_TOKEN=${TOKEN}" >> "${GITHUB_ENV}"

    - name: Validate the CLI is installed
      if: ${{ inputs.token != '' }}
      run: linode-cli --version
      shell: bash
